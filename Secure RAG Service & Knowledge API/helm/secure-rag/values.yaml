replicaCount: 2

image:
  repository: secure-rag-api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# Existing Kubernetes Secret with JWT_SECRET and DEV_API_KEY.
existingSecret: secure-rag-secrets

env:
  qdrantUrl: http://qdrant:6333
  qdrantCollection: rag_docs
  qdrantApiKey: ""
  jwtIssuer: secure-rag
  jwtTtlSeconds: "3600"
  ragVectorSize: "64"
  ragChunkSize: "800"
  ragChunkOverlap: "120"
  ragTopK: "4"

serviceAccount:
  create: true
  name: ""

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  behavior: {}

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}

spreadAcrossZones: true
