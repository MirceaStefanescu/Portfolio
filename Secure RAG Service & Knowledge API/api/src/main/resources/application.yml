server:
  port: ${PORT:8080}

spring:
  application:
    name: secure-rag-api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

rag:
  provider: ${RAG_PROVIDER:local}
  provider-base-url: ${RAG_PROVIDER_BASE_URL:}
  provider-api-key: ${RAG_PROVIDER_API_KEY:}
  embedding-model: ${RAG_EMBEDDING_MODEL:}
  chat-model: ${RAG_CHAT_MODEL:}
  chunk-size: ${RAG_CHUNK_SIZE:800}
  chunk-overlap: ${RAG_CHUNK_OVERLAP:120}
  top-k: ${RAG_TOP_K:4}
  vector-size: ${RAG_VECTOR_SIZE:64}

qdrant:
  url: ${QDRANT_URL:http://localhost:6333}
  collection: ${QDRANT_COLLECTION:rag_docs}
  api-key: ${QDRANT_API_KEY:}

security:
  dev-api-key: ${DEV_API_KEY:}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:secure-rag}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}

audit:
  max-events: ${AUDIT_MAX_EVENTS:500}

logging:
  level:
    com.portfolio.securerag: INFO
