name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26.11.1"
      - name: Install dependencies
        run: npm ci
        working-directory: app
      - name: Run tests
        run: npm test
        working-directory: app
