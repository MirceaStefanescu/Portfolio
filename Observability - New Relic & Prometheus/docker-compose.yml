services:
  mimir:
    image: grafana/mimir:3.2.0
    command: ["-config.file=/etc/mimir/mimir.yml"]
    volumes:
      - ./mimir/mimir.yml:/etc/mimir/mimir.yml:ro
      - mimir-data:/data
    ports:
      - "127.0.0.1:9009:9009"

  prometheus-secondary:
    image: prom/prometheus:v2.49.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./prometheus/secondary.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-secondary-data:/prometheus

  demo-api-secondary:
    build:
      context: ../CI/CD Pipeline Automation
    mem_limit: 512m

  blackbox:
    image: prom/blackbox-exporter:v0.29.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  paging-demo:
    build: ./paging-demo
    volumes:
      - paging-data:/data
    ports:
      - "127.0.0.1:8088:8088"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otel-collector/${OTEL_COLLECTOR_CONFIG:-config.yaml}"]
    volumes:
      - ./otel-collector:/etc/otel-collector:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"
    environment:
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-}

  telemetrygen-traces:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.162.0
    command:
      [
        "traces",
        "--otlp-endpoint",
        "otel-collector:4317",
        "--otlp-insecure",
        "--duration",
        "inf",
        "--rate",
        "1",
        "--batch-size",
        "1",
        "--service",
        "demo-service"
      ]
    depends_on:
      - otel-collector
    restart: unless-stopped

  telemetrygen-metrics:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.162.0
    command:
      [
        "metrics",
        "--otlp-endpoint",
        "otel-collector:4317",
        "--otlp-insecure",
        "--duration",
        "inf",
        "--rate",
        "1",
        "--batch-size",
        "1",
        "--otlp-attributes",
        "service.name=\"demo-service\""
      ]
    depends_on:
      - otel-collector
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.49.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

  loki:
    image: grafana/loki:2.9.7
    command:
      - "-config.file=/etc/loki/loki.yml"
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  promtail:
    image: grafana/promtail:2.9.7
    command:
      - "-config.file=/etc/promtail/promtail.yml"
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - ./logs:/var/log/app:ro
    depends_on:
      - loki

  demo-api:
    build:
      context: ../CI/CD Pipeline Automation
    mem_limit: 512m

  log-generator:
    image: busybox:1.38
    command:
      - "sh"
      - "-c"
      - "i=0; while true; do echo \"$$(date -Iseconds) level=info msg=\\\"heartbeat\\\" count=$$i\" >> /var/log/app/app.log; i=$$((i+1)); wget -q -O /dev/null http://demo-api:8080/api/info || true; sleep 2; done"
    volumes:
      - ./logs:/var/log/app

volumes:
  mimir-data:
  prometheus-secondary-data:
  paging-data:
  loki-data:
  prometheus-data:
  grafana-data:
