global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: demo-a

remote_write:
  - url: http://mimir:9009/api/v1/push

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: synthetic-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://demo-api:8080/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "demo-api"
    static_configs:
      - targets: ["demo-api:8080"]
        labels:
          namespace: local-demo
          pod: demo-api

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
