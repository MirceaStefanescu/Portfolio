global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "demo-api"
    static_configs:
      - targets: ["demo-api:8080"]
        labels:
          namespace: local-demo
          pod: demo-api

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]
