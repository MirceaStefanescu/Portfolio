global:
  resolve_timeout: 5m

route:
  receiver: "local-paging"
  group_by: ["alertname", "service", "namespace"]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 3h

receivers:
  - name: "local-paging"
    slack_configs:
      - api_url: http://paging-demo:8088/slack
        channel: "#local-demo"
        send_resolved: true
        title: "{{ .CommonLabels.alertname }}"
        text: "STATUS={{ .Status }} ALERT={{ .CommonLabels.alertname }} {{ range .Alerts }}{{ .Annotations.summary }} {{ end }}"
    pagerduty_configs:
      - url: http://paging-demo:8088/pagerduty
        routing_key: local-demo-route
        send_resolved: true
        description: "{{ .CommonLabels.alertname }}: {{ range .Alerts }}{{ .Annotations.summary }} {{ end }}"
        source: demo-a
        severity: "{{ .CommonLabels.severity }}"
