name: Demonstrative supply chain
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: DevSecOps Pipeline with SBOM & SLSA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15'
      - name: Install verified policy engine
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --output conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz
          echo 'c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985  conftest.tar.gz' | sha256sum --check --strict
          tar -xzf conftest.tar.gz conftest
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build, scan, sign, enforce policy and verify recovery copies
        env:
          LOCAL_DEMO: '1'
          USE_LOCAL_REGISTRY: '1'
          REGISTRY: localhost:5000
          REGISTRY_PORT: '5000'
          COMPOSE_PROJECT_NAME: supply-demo-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          export COSIGN_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          trap 'docker compose down --volumes; unset COSIGN_PASSWORD' EXIT
          bash scripts/test-pipeline.sh
          python scripts/test-release-policy.py
          conftest verify --policy policy/release --data policy/release/data.json
          bash scripts/pipeline.sh dev
          python scripts/check-demo-artifacts.py --artifacts artifacts --storage storage --backups backups --keys .keys
