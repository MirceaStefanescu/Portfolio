services:
  registry:
    image: registry:2
    ports:
      - "127.0.0.1:${REGISTRY_PORT:-5000}:${REGISTRY_PORT:-5000}"
    environment:
      REGISTRY_HTTP_ADDR: "0.0.0.0:${REGISTRY_PORT:-5000}"
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry

volumes:
  registry-data:
