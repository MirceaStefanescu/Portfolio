# Native public triggers, job graph and approval contexts; implementations are private and pinned.
name: GitOps Platform CI
'on':
  workflow_call:
    secrets:
      PORTFOLIO_AUTOMATION_SSH_KEY:
        required: true
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: GitOps Platform - Argo CD & Helm
    steps:
      - name: Read the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned private automation
        uses: ./.github/actions/private-automation
        with:
          ssh-key: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
      - name: Run the private implementation
        uses: ./.private-automation/.github/actions/gitops-ci
