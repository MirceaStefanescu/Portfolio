# Native public triggers, job graph and approval contexts; implementations are private and pinned.
name: Portfolio CI
'on':
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Presentation and CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Read the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned private automation
        uses: ./.github/actions/private-automation
        with:
          ssh-key: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
      - name: Run the private implementation
        uses: ./.private-automation/.github/actions/ci-quality
        id: scope
  node:
    needs: quality
    if: ${{ needs.quality.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: CI/CD Pipeline Automation
            angular: false
            build: false
          - directory: Automated Infrastructure & Deployment Platform/portal
            angular: false
            build: false
          - directory: Secure Secrets Management & Observability Toolkit/app
            angular: false
            build: false
          - directory: Full Stack E-commerce Application with Angular and Spring Boot/frontend
            angular: true
            build: true
          - directory: Real-Time Chat & Collaboration Platform/frontend
            angular: true
            build: true
          - directory: Habit Tracker & Routine Coach SaaS/backend
            angular: false
            build: false
          - directory: Habit Tracker & Routine Coach SaaS/frontend
            angular: false
            build: true
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Read the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned private automation
        uses: ./.github/actions/private-automation
        with:
          ssh-key: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
      - name: Run the private implementation
        uses: ./.private-automation/.github/actions/ci-node
        with:
          angular: ${{ matrix.angular }}
          build: ${{ matrix.build }}
          directory: ${{ matrix.directory }}
  java:
    needs: quality
    if: ${{ needs.quality.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: Event-Driven E-Commerce Platform/services/order-service
            java: '25'
          - directory: Event-Driven E-Commerce Platform/services/inventory-service
            java: '25'
          - directory: Full Stack E-commerce Application with Angular and Spring Boot/backend
            java: '26'
          - directory: Real-Time Chat & Collaboration Platform/backend
            java: '25'
          - directory: Secure RAG Service & Knowledge API/api
            java: '25'
          - directory: Predictive Analytics Pipeline on Kubernetes/api
            java: '25'
          - directory: Predictive Analytics Pipeline on Kubernetes/flink
            java: '11'
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Read the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned private automation
        uses: ./.github/actions/private-automation
        with:
          ssh-key: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
      - name: Run the private implementation
        uses: ./.private-automation/.github/actions/ci-java
        with:
          directory: ${{ matrix.directory }}
          java: ${{ matrix.java }}
  cloud-native-python:
    needs: quality
    if: ${{ needs.quality.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service:
          - product-service
          - order-service
          - payment-service
          - gateway
    defaults:
      run:
        working-directory: Cloud-Native E-Commerce Platform/services/${{ matrix.service }}
    steps:
      - name: Read the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned private automation
        uses: ./.github/actions/private-automation
        with:
          ssh-key: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
      - name: Run the private implementation
        uses: ./.private-automation/.github/actions/ci-cloud-native-python
        with:
          service: ${{ matrix.service }}
  broker-integration:
    needs: quality
    if: ${{ needs.quality.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned private automation
        uses: ./.github/actions/private-automation
        with:
          ssh-key: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
      - name: Run the private implementation
        uses: ./.private-automation/.github/actions/ci-broker-integration
  launcher:
    needs: quality
    if: ${{ needs.quality.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned private automation
        uses: ./.github/actions/private-automation
        with:
          ssh-key: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
      - name: Run the private implementation
        uses: ./.private-automation/.github/actions/ci-launcher
  docker-build:
    needs: quality
    if: ${{ needs.quality.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        directory:
          - Automated Infrastructure & Deployment Platform/portal
          - CI/CD Pipeline Automation
          - Cloud-Native E-Commerce Platform/services/order-service
          - Cloud-Native E-Commerce Platform/services/payment-service
          - Cloud-Native E-Commerce Platform/services/product-service
          - Cloud-Native E-Commerce Platform/services/gateway
          - DevSecOps Pipeline with SBOM & SLSA/app
          - Event-Driven E-Commerce Platform/services/inventory-service
          - Event-Driven E-Commerce Platform/services/order-service
          - Full Stack E-commerce Application with Angular and Spring Boot/backend
          - Full Stack E-commerce Application with Angular and Spring Boot/frontend
          - Predictive Analytics Pipeline on Kubernetes/api
          - Predictive Analytics Pipeline on Kubernetes/flink
          - Real-Time Chat & Collaboration Platform/backend
          - Real-Time Chat & Collaboration Platform/frontend
          - Secure RAG Service & Knowledge API/api
          - Secure Secrets Management & Observability Toolkit/app
    steps:
      - name: Read the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned private automation
        uses: ./.github/actions/private-automation
        with:
          ssh-key: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
      - name: Run the private implementation
        uses: ./.private-automation/.github/actions/ci-docker-build
        with:
          directory: ${{ matrix.directory }}
  chat-postgres:
    needs: quality
    if: ${{ needs.quality.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: chat_test
          POSTGRES_USER: chat_test
          POSTGRES_PASSWORD: integration-only
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U chat_test -d chat_test" --health-interval 5s --health-timeout 3s --health-retries
          10
    defaults:
      run:
        working-directory: Real-Time Chat & Collaboration Platform/backend
    env:
      CHAT_TEST_DB_URL: jdbc:postgresql://localhost:5432/chat_test
      CHAT_TEST_DB_USER: chat_test
      CHAT_TEST_DB_PASSWORD: integration-only
    steps:
      - name: Read the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned private automation
        uses: ./.github/actions/private-automation
        with:
          ssh-key: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
      - name: Run the private implementation
        uses: ./.private-automation/.github/actions/ci-chat-postgres
  container-validation:
    needs: quality
    if: ${{ needs.quality.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory:
          - Secure Secrets Management & Observability Toolkit
          - Observability - New Relic & Prometheus
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Read the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned private automation
        uses: ./.github/actions/private-automation
        with:
          ssh-key: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
      - name: Run the private implementation
        uses: ./.private-automation/.github/actions/ci-container-validation
        with:
          directory: ${{ matrix.directory }}
  demo-integration:
    needs: quality
    if: ${{ needs.quality.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - portal
          - chat
          - ecommerce
          - predictive
          - observability
          - secrets
          - event-driven
          - rag
          - habit
    steps:
      - name: Read the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned private automation
        uses: ./.github/actions/private-automation
        with:
          ssh-key: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
      - name: Run the private implementation
        uses: ./.private-automation/.github/actions/ci-demo-integration
        with:
          project: ${{ matrix.project }}
  infrastructure-policy:
    needs: quality
    if: ${{ needs.quality.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned private automation
        uses: ./.github/actions/private-automation
        with:
          ssh-key: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
      - name: Run the private implementation
        uses: ./.private-automation/.github/actions/ci-infrastructure-policy
  terraform:
    needs: quality
    if: ${{ needs.quality.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: Automated Infrastructure & Deployment Platform/terraform/environments/dev
            lock-args: -lockfile=readonly
          - directory: Automated Infrastructure & Deployment Platform/terraform/modules/platform
            lock-args: ''
          - directory: CI/CD Pipeline Automation/terraform/environments/aws-eks
            lock-args: -lockfile=readonly
          - directory: CI/CD Pipeline Automation/terraform/environments/local-kind
            lock-args: -lockfile=readonly
          - directory: CI/CD Pipeline Automation/terraform/modules/cicd-app
            lock-args: ''
          - directory: Cloud-Native E-Commerce Platform/infra/terraform
            lock-args: -lockfile=readonly
          - directory: Event-Driven E-Commerce Platform/infra/terraform
            lock-args: -lockfile=readonly
          - directory: GitOps Platform - Argo CD & Helm/terraform/aws
            lock-args: -lockfile=readonly
          - directory: GitOps Platform - Argo CD & Helm/terraform/azure
            lock-args: -lockfile=readonly
          - directory: GitOps Platform - Argo CD & Helm/terraform/gcp
            lock-args: -lockfile=readonly
          - directory: Real-Time Chat & Collaboration Platform/infra/terraform
            lock-args: -lockfile=readonly
          - directory: Secure Secrets Management & Observability Toolkit/terraform/examples/local-vault
            lock-args: -lockfile=readonly
          - directory: Secure Secrets Management & Observability Toolkit/terraform/modules/observability-stack
            lock-args: ''
          - directory: Secure Secrets Management & Observability Toolkit/terraform/modules/vault-policy
            lock-args: ''
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    env:
      TF_IN_AUTOMATION: 'true'
      TF_LOCK_ARGS: ${{ matrix.lock-args }}
    steps:
      - name: Read the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned private automation
        uses: ./.github/actions/private-automation
        with:
          ssh-key: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
      - name: Run the private implementation
        uses: ./.private-automation/.github/actions/ci-terraform
        with:
          directory: ${{ matrix.directory }}
  helm:
    needs: quality
    if: ${{ needs.quality.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        chart:
          - Automated Infrastructure & Deployment Platform/helm/charts/platform-portal
          - GitOps Platform - Argo CD & Helm/charts/platform-service
          - Observability - New Relic & Prometheus/helm/reliability-pack
          - Secure RAG Service & Knowledge API/helm/secure-rag
    steps:
      - name: Read the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned private automation
        uses: ./.github/actions/private-automation
        with:
          ssh-key: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
      - name: Run the private implementation
        uses: ./.private-automation/.github/actions/ci-helm
        with:
          chart: ${{ matrix.chart }}
  finops:
    needs: quality
    if: ${{ needs.quality.outputs.scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned private automation
        uses: ./.github/actions/private-automation
        with:
          ssh-key: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
      - name: Run the private implementation
        uses: ./.private-automation/.github/actions/ci-finops
  gitops:
    needs: quality
    if: ${{ needs.quality.outputs.scope == 'full' }}
    uses: ./.github/workflows/gitops-platform-ci.yml
    secrets:
      PORTFOLIO_AUTOMATION_SSH_KEY: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
  prompt-quality:
    needs: quality
    if: ${{ needs.quality.outputs.scope == 'full' }}
    uses: ./.github/workflows/prompt-quality-safety-ci.yml
    secrets:
      PORTFOLIO_AUTOMATION_SSH_KEY: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
  llmops:
    needs: quality
    if: ${{ needs.quality.outputs.scope == 'full' }}
    uses: ./.github/workflows/llmops-eval-harness-ci.yml
    secrets:
      PORTFOLIO_AUTOMATION_SSH_KEY: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
  status:
    name: Portfolio status
    if: ${{ always() }}
    needs:
      - quality
      - node
      - java
      - cloud-native-python
      - broker-integration
      - launcher
      - chat-postgres
      - container-validation
      - demo-integration
      - docker-build
      - infrastructure-policy
      - terraform
      - helm
      - finops
      - gitops
      - prompt-quality
      - llmops
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      CI_EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Read the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned private automation
        uses: ./.github/actions/private-automation
        with:
          ssh-key: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
      - name: Run the private implementation
        uses: ./.private-automation/.github/actions/ci-status
