name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: CI/CD Pipeline Automation
            angular: false
            build: false
          - directory: Automated Infrastructure & Deployment Platform/portal
            angular: false
            build: false
          - directory: Secure Secrets Management & Observability Toolkit/app
            angular: false
            build: false
          - directory: Full Stack E-commerce Application with Angular and Spring Boot/frontend
            angular: true
            build: true
          - directory: Real-Time Chat & Collaboration Platform/frontend
            angular: true
            build: true
          - directory: Habit Tracker & Routine Coach SaaS/backend
            angular: false
            build: false
          - directory: Habit Tracker & Routine Coach SaaS/frontend
            angular: false
            build: true
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - if: ${{ matrix.angular }}
        run: npm test -- --watch=false
      - if: ${{ !matrix.angular }}
        run: npm test
      - if: ${{ matrix.build }}
        run: npm run build
      - if: ${{ matrix.directory == 'CI/CD Pipeline Automation' }}
        run: npm run lint
      - if: ${{ matrix.directory == 'CI/CD Pipeline Automation' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14' # ansible-core 2.21 supports control nodes through Python 3.14
      - if: ${{ matrix.directory == 'CI/CD Pipeline Automation' }}
        run: python -m pip install ansible-core==2.21.5
      - if: ${{ matrix.directory == 'CI/CD Pipeline Automation' }}
        run: bash scripts/test-ansible.sh

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: Event-Driven E-Commerce Platform/services/order-service
            java: '25'
          - directory: Event-Driven E-Commerce Platform/services/inventory-service
            java: '25'
          - directory: Full Stack E-commerce Application with Angular and Spring Boot/backend
            java: '26'
          - directory: Real-Time Chat & Collaboration Platform/backend
            java: '25'
          - directory: Secure RAG Service & Knowledge API/api
            java: '25'
          - directory: Predictive Analytics Pipeline on Kubernetes/api
            java: '25'
          - directory: Predictive Analytics Pipeline on Kubernetes/flink
            java: '11'
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress --strict-checksums verify

  cloud-native-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [product-service, order-service, payment-service, gateway]
    defaults:
      run:
        working-directory: Cloud-Native E-Commerce Platform/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: Cloud-Native E-Commerce Platform/services/*/requirements*.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff check app tests
      - run: python -m ruff format --check app tests
      - run: python -m pytest -q

  broker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
      - run: make integration-test
        working-directory: Cloud-Native E-Commerce Platform

  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
      - run: ./portfolio-launcher.sh --list
      - name: Prepare documented Chat environment example
        run: cp "Real-Time Chat & Collaboration Platform/.env.example" "Real-Time Chat & Collaboration Platform/.env"
      - run: python tests/test-compose-ports.py
      - run: bash tests/test-portfolio-launcher.sh
      - run: bash "GitOps Platform - Argo CD & Helm/scripts/test-promote.sh"
      - run: bash "GitOps Platform - Argo CD & Helm/scripts/test-promotion-pr.sh"
      - run: bash "CI/CD Pipeline Automation/scripts/test-terraform-gate.sh"
      - run: python "GitOps Platform - Argo CD & Helm/scripts/test-dora.py"
      - run: python tests/test-release-environment.py
      - run: python "Predictive Analytics Pipeline on Kubernetes/ml/train.py" --check
      - run: python "Secure RAG Service & Knowledge API/scripts/test_evaluate.py"
      - run: node --test "Event-Driven E-Commerce Platform/scripts/test-demo-ui.cjs"
      - run: python "Observability - New Relic & Prometheus/paging-demo/test_receiver.py"
      - run: bash tests/test-ci-status.sh
      - run: bash "DevSecOps Pipeline with SBOM & SLSA/scripts/test-pipeline.sh"
      - run: python "DevSecOps Pipeline with SBOM & SLSA/scripts/test-release-policy.py"

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        directory:
          - Automated Infrastructure & Deployment Platform/portal
          - CI/CD Pipeline Automation
          - Cloud-Native E-Commerce Platform/services/order-service
          - Cloud-Native E-Commerce Platform/services/payment-service
          - Cloud-Native E-Commerce Platform/services/product-service
          - Cloud-Native E-Commerce Platform/services/gateway
          - DevSecOps Pipeline with SBOM & SLSA/app
          - Event-Driven E-Commerce Platform/services/inventory-service
          - Event-Driven E-Commerce Platform/services/order-service
          - Full Stack E-commerce Application with Angular and Spring Boot/backend
          - Full Stack E-commerce Application with Angular and Spring Boot/frontend
          - Predictive Analytics Pipeline on Kubernetes/api
          - Predictive Analytics Pipeline on Kubernetes/flink
          - Real-Time Chat & Collaboration Platform/backend
          - Real-Time Chat & Collaboration Platform/frontend
          - Secure RAG Service & Knowledge API/api
          - Secure Secrets Management & Observability Toolkit/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build deployable image
        working-directory: ${{ matrix.directory }}
        run: docker build --progress=plain --tag portfolio-validation:ci .

  chat-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: chat_test
          POSTGRES_USER: chat_test
          POSTGRES_PASSWORD: integration-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U chat_test -d chat_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: Real-Time Chat & Collaboration Platform/backend
    env:
      CHAT_TEST_DB_URL: jdbc:postgresql://localhost:5432/chat_test
      CHAT_TEST_DB_USER: chat_test
      CHAT_TEST_DB_PASSWORD: integration-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress --strict-checksums -Dtest=ChatPostgresIntegrationTest test

  container-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory:
          - Secure Secrets Management & Observability Toolkit
          - Observability - New Relic & Prometheus
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make test

  demo-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [portal, chat, ecommerce, predictive, observability, secrets, event-driven, rag, habit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
      - if: ${{ matrix.project == 'chat' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
      - if: ${{ matrix.project == 'chat' }}
        run: npm ci
        working-directory: Real-Time Chat & Collaboration Platform/frontend
      - name: Verify an isolated runnable demo and clean up its data
        run: python scripts/demo-check.py "${{ matrix.project }}"
      - if: ${{ matrix.project == 'rag' }}
        name: Verify vector replication and snapshot recovery
        run: python "Secure RAG Service & Knowledge API/scripts/resilience-demo.py"
      - if: ${{ matrix.project == 'portal' }}
        name: Verify the local DORA exporter and Grafana dashboard
        run: python "GitOps Platform - Argo CD & Helm/scripts/demo-dora.py"
      - name: Verify KMS auto-unseal, replication and outage recovery
        if: ${{ matrix.project == 'secrets' }}
        run: python "Secure Secrets Management & Observability Toolkit/scripts/kms-region-demo.py"

  infrastructure-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Install verified Conftest release
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --output conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz
          echo 'c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985  conftest.tar.gz' | sha256sum --check --strict
          tar -xzf conftest.tar.gz conftest
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: python tests/test-policy-runner.py
      - run: python scripts/check-policy.py "Automated Infrastructure & Deployment Platform"
      - run: python scripts/check-policy.py "CI/CD Pipeline Automation"
      - run: python scripts/check-policy.py "GitOps Platform - Argo CD & Helm"
      - run: python scripts/check-policy.py "Secure Secrets Management & Observability Toolkit"
      - run: conftest verify --policy "DevSecOps Pipeline with SBOM & SLSA/policy/release" --data "DevSecOps Pipeline with SBOM & SLSA/policy/release/data.json"

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: Automated Infrastructure & Deployment Platform/terraform/environments/dev
            lock-args: '-lockfile=readonly'
          - directory: Automated Infrastructure & Deployment Platform/terraform/modules/platform
            lock-args: ''
          - directory: CI/CD Pipeline Automation/terraform/environments/aws-eks
            lock-args: '-lockfile=readonly'
          - directory: CI/CD Pipeline Automation/terraform/environments/local-kind
            lock-args: '-lockfile=readonly'
          - directory: CI/CD Pipeline Automation/terraform/modules/cicd-app
            lock-args: ''
          - directory: Cloud-Native E-Commerce Platform/infra/terraform
            lock-args: '-lockfile=readonly'
          - directory: Event-Driven E-Commerce Platform/infra/terraform
            lock-args: '-lockfile=readonly'
          - directory: GitOps Platform - Argo CD & Helm/terraform/aws
            lock-args: '-lockfile=readonly'
          - directory: GitOps Platform - Argo CD & Helm/terraform/azure
            lock-args: '-lockfile=readonly'
          - directory: GitOps Platform - Argo CD & Helm/terraform/gcp
            lock-args: '-lockfile=readonly'
          - directory: Real-Time Chat & Collaboration Platform/infra/terraform
            lock-args: '-lockfile=readonly'
          - directory: Secure Secrets Management & Observability Toolkit/terraform/examples/local-vault
            lock-args: '-lockfile=readonly'
          - directory: Secure Secrets Management & Observability Toolkit/terraform/modules/observability-stack
            lock-args: ''
          - directory: Secure Secrets Management & Observability Toolkit/terraform/modules/vault-policy
            lock-args: ''
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    env:
      TF_IN_AUTOMATION: 'true'
      TF_LOCK_ARGS: ${{ matrix.lock-args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false $TF_LOCK_ARGS
      - run: terraform validate -no-color

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        chart:
          - Automated Infrastructure & Deployment Platform/helm/charts/platform-portal
          - GitOps Platform - Argo CD & Helm/charts/platform-service
          - Observability - New Relic & Prometheus/helm/reliability-pack
          - Secure RAG Service & Knowledge API/helm/secure-rag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Lint and render chart
        env:
          CHART: ${{ matrix.chart }}
        run: |
          helm lint --strict "$CHART"
          helm template validation "$CHART" > "$RUNNER_TEMP/rendered.yaml"
          test -s "$RUNNER_TEMP/rendered.yaml"

  finops:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install verified kubeconform release
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --output kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz' | sha256sum --check --strict
          tar -xzf kubeconform.tar.gz kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: make test
        working-directory: Kubernetes FinOps & Cost Optimization

  gitops:
    uses: ./.github/workflows/gitops-platform-ci.yml
  prompt-quality:
    uses: ./.github/workflows/prompt-quality-safety-ci.yml
  llmops:
    uses: ./.github/workflows/llmops-eval-harness-ci.yml
  status:
    name: Portfolio status
    if: ${{ always() }}
    needs: [node, java, cloud-native-python, broker-integration, launcher, chat-postgres, container-validation, demo-integration, docker-build, infrastructure-policy, terraform, helm, finops, gitops, prompt-quality, llmops]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
      - run: bash scripts/check-ci-status.sh
