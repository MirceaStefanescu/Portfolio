name: llmops-eval-harness-ci

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: LLMOps Evaluation Harness
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          cache: "pip"
          cache-dependency-path: |
            LLMOps Evaluation Harness/requirements-dev.txt
            LLMOps Evaluation Harness/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest -q

      - name: Build
        run: python -m build
