# Native public triggers, job graph and approval contexts; implementations are private and pinned.
name: llmops-eval-harness-ci
'on':
  workflow_call:
    secrets:
      PORTFOLIO_AUTOMATION_SSH_KEY:
        required: true
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  eval-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: LLMOps Evaluation Harness
    steps:
      - name: Read the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned private automation
        uses: ./.github/actions/private-automation
        with:
          ssh-key: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
      - name: Run the private implementation
        uses: ./.private-automation/.github/actions/llmops-ci
