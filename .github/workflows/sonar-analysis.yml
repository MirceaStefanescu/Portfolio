# Native public triggers, job graph and approval contexts; implementations are private and pinned.
name: Portfolio Sonar baseline
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: portfolio-sonar-main
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'MirceaStefanescu/Portfolio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Read the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned private automation
        uses: ./.github/actions/private-automation
        with:
          ssh-key: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
      - name: Run the private implementation
        uses: ./.private-automation/.github/actions/sonar-plan
        id: plan
  analyze:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: Sonar / ${{ matrix.id }}
    steps:
      - name: Read the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned private automation
        uses: ./.github/actions/private-automation
        with:
          ssh-key: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
      - name: Run the private implementation
        uses: ./.private-automation/.github/actions/sonar-analyze
        with:
          id: ${{ matrix.id }}
          jdk: ${{ matrix.jdk }}
          node: ${{ matrix.node }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
env:
  SONAR_SOURCE_SHA: ${{ github.sha }}
