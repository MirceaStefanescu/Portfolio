name: GitOps Platform Promote

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (dev, staging, prod)
        required: true
        type: choice
        options: [dev, staging, prod]
      image_tag:
        description: Image tag to propose
        required: true
      strategy:
        description: Rollout strategy override (optional)
        required: false

permissions:
  contents: read

concurrency:
  group: gitops-promote-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      pull-requests: write
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      ROLLOUT_STRATEGY: ${{ inputs.strategy }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PROMOTION_BRANCH: automation/promote-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Propose promotion
        run: bash "GitOps Platform - Argo CD & Helm/scripts/open-promotion-pr.sh" "$TARGET_ENVIRONMENT" "$IMAGE_TAG" "$ROLLOUT_STRATEGY"
