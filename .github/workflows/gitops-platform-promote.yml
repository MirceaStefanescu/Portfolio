name: GitOps Platform Promote

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (dev, staging, prod)
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      image_tag:
        description: Image tag to promote
        required: true
      strategy:
        description: Rollout strategy override (optional)
        required: false

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      ROLLOUT_STRATEGY: ${{ inputs.strategy }}
    defaults:
      run:
        working-directory: "GitOps Platform - Argo CD & Helm"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update environment values
        run: |
          bash ./scripts/promote.sh "$TARGET_ENVIRONMENT" "$IMAGE_TAG" "$ROLLOUT_STRATEGY"

      - name: Commit and push
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "charts/platform-service/env/$TARGET_ENVIRONMENT.yaml"
          git commit -m "promote: $TARGET_ENVIRONMENT -> $IMAGE_TAG"
          git push
