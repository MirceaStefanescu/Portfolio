# Native public triggers, job graph and approval contexts; implementations are private and pinned.
name: GitOps Platform Promote
'on':
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (dev, staging, prod)
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      image_tag:
        description: Image tag to propose
        required: true
      strategy:
        description: Rollout strategy override (optional)
        required: false
permissions:
  contents: read
concurrency:
  group: gitops-promote-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  promote:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      pull-requests: write
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      ROLLOUT_STRATEGY: ${{ inputs.strategy }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PROMOTION_BRANCH: automation/promote-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Read the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned private automation
        uses: ./.github/actions/private-automation
        with:
          ssh-key: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
      - name: Run the private implementation
        uses: ./.private-automation/.github/actions/gitops-promote
        with:
          github-token: ${{ github.token }}
