# Native public triggers, job graph and approval contexts; implementations are private and pinned.
name: Public portfolio availability
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/public-site-availability.yml
      - tests/test-public-site-monitor.py
      - docs/public-site-availability.md
      - .github/private-automation.json
      - .github/actions/private-automation/**
  schedule:
    - cron: 17 * * * *
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: public-site-availability-main
  cancel-in-progress: false
jobs:
  public-pages:
    name: Public HTTP check
    if: github.repository == 'MirceaStefanescu/Portfolio' && github.event.repository.visibility == 'public' && github.ref
      == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read the exact public source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned private automation
        uses: ./.github/actions/private-automation
        with:
          ssh-key: ${{ secrets.PORTFOLIO_AUTOMATION_SSH_KEY }}
      - name: Run the private implementation
        uses: ./.private-automation/.github/actions/public-site-availability
