apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: flink-taskmanager-scaler
  namespace: predictive-analytics
spec:
  scaleTargetRef:
    name: flink-taskmanager
  pollingInterval: 5
  cooldownPeriod: 30
  minReplicaCount: 1
  maxReplicaCount: 3
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 30
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka.predictive-analytics.svc.cluster.local:9092
        topic: events
        consumerGroup: predictive-analytics
        lagThreshold: "5"
        offsetResetPolicy: earliest
