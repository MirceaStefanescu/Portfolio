apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictive-analytics-api
  namespace: predictive-analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: predictive-analytics-api
  template:
    metadata:
      labels:
        app: predictive-analytics-api
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: confluentinc/cp-schema-registry:7.9.10
          command:
            - /bin/bash
            - -ec
            - |
              for attempt in {1..45}; do
                if curl --fail --silent http://schema-registry:8081/subjects >/dev/null && (echo >/dev/tcp/postgres/5432) 2>/dev/null; then
                  exit 0
                fi
                sleep 2
              done
              echo "Database or Schema Registry did not become ready" >&2
              exit 1
      containers:
        - name: api
          image: predictive-analytics-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: predictive-analytics-config
            - secretRef:
                name: predictive-analytics-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
