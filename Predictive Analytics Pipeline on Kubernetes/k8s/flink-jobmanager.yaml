apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  namespace: predictive-analytics
spec:
  selector:
    app: flink-jobmanager
  ports:
    - name: ui
      port: 8081
      targetPort: 8081
    - name: rpc
      port: 6123
      targetPort: 6123
    - name: blob
      port: 6124
      targetPort: 6124
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  namespace: predictive-analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink-jobmanager
  template:
    metadata:
      labels:
        app: flink-jobmanager
    spec:
      securityContext:
        fsGroup: 9999
      containers:
        - name: jobmanager
          image: predictive-analytics-flink-job:latest
          imagePullPolicy: IfNotPresent
          args: ["standalone-job", "--job-classname", "com.portfolio.pipeline.flink.PredictionJob"]
          envFrom:
            - configMapRef:
                name: predictive-analytics-config
            - secretRef:
                name: predictive-analytics-secrets
          ports:
            - containerPort: 8081
            - containerPort: 6123
            - containerPort: 6124
          env:
            - name: FLINK_PROPERTIES
              value: |
                jobmanager.rpc.address: flink-jobmanager
                scheduler-mode: reactive
                state.checkpoints.dir: file:///opt/flink/checkpoints
                state.checkpoints.num-retained: 3
                jobmanager.memory.process.size: 1024m
          volumeMounts:
            - name: checkpoints
              mountPath: /opt/flink/checkpoints
          readinessProbe:
            httpGet:
              path: /overview
              port: 8081
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "2", memory: 1536Mi}
      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: flink-checkpoints
