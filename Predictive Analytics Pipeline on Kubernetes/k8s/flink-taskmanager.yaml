apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  namespace: predictive-analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink-taskmanager
  template:
    metadata:
      labels:
        app: flink-taskmanager
    spec:
      securityContext:
        fsGroup: 9999
      containers:
        - name: taskmanager
          image: predictive-analytics-flink-job:latest
          imagePullPolicy: IfNotPresent
          args: ["taskmanager"]
          env:
            - name: FLINK_PROPERTIES
              value: |
                jobmanager.rpc.address: flink-jobmanager
                taskmanager.numberOfTaskSlots: 1
                taskmanager.memory.process.size: 1024m
                state.checkpoints.dir: file:///opt/flink/checkpoints
          volumeMounts:
            - name: checkpoints
              mountPath: /opt/flink/checkpoints
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: flink-checkpoints
