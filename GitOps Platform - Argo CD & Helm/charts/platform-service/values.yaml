replicaCount: 2
environment: dev
extraEnv: []
envFromSecret: ""
healthPath: /healthz

image:
  repository: portfolio-podinfo
  tag: "6.15.0-security1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9898

rollout:
  enabled: true
  strategy: canary
  progressDeadlineSeconds: 120
  analysis:
    enabled: true
    interval: 5s
    count: 3
    # Podinfo returns uppercase OK; callers can select their endpoint's exact value.
    path: /healthz
    expectedStatus: OK
  canary:
    steps:
      - setWeight: 20
      - pause:
          duration: 30s
      - setWeight: 50
      - pause:
          duration: 30s
      - setWeight: 100
  blueGreen:
    autoPromotionEnabled: false
    previewReplicaCount: 1

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
