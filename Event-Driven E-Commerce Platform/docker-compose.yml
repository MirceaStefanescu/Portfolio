services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.10
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    ports:
      - "127.0.0.1:2182:2181"

  kafka:
    image: confluentinc/cp-kafka:7.9.10
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:19092:9092"

  order-service:
    build: ./services/order-service
    depends_on:
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INVENTORY_URL: http://inventory-service:8082
      APP_SCHEMA_REGISTRATION_ENABLED: "true"
      APP_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      DATABASE_URL: jdbc:h2:file:/app/data/order;DB_CLOSE_ON_EXIT=FALSE
    volumes:
      - order-data:/app/data
    ports:
      - "127.0.0.1:18081:8081"

  inventory-service:
    build: ./services/inventory-service
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: jdbc:h2:file:/app/data/inventory;DB_CLOSE_ON_EXIT=FALSE
    volumes:
      - inventory-data:/app/data
    ports:
      - "127.0.0.1:18082:8082"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.10
    depends_on:
      - kafka
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/subjects"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:18083:8081"

  prometheus:
    image: prom/prometheus:v2.51.2
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9091:9090"

  grafana:
    image: grafana/grafana:13.2.4
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:13000:3000"

volumes:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
  order-data:
  inventory-data:
