apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: cloud-native-ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          imagePullPolicy: IfNotPresent
          image: cn-payment-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: commerce-databases
                  key: payment-url
            - name: KAFKA_BOOTSTRAP
              value: kafka:9092
            - name: KAFKA_TOPIC_PAYMENTS
              value: payments
            - name: RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672/
            - name: PAYMENT_QUEUE
              value: payment.requests
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: data
          emptyDir: {}
