version: "3.9"

services:
  gateway:
    build: ./services/gateway
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set a random gateway JWT_SECRET of at least 32 bytes}
      JWT_ISSUER: ${JWT_ISSUER:-portfolio}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-commerce}
      REDIS_URL: redis://gateway-redis:6379/0
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
    ports:
      - "127.0.0.1:8088:8000"
    depends_on:
      - gateway-redis
      - product-service
      - order-service
      - payment-service

  gateway-redis:
    image: redis:7-alpine

  postgres-products:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: products
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD:-local-products-only}
    volumes:
      - products-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U products -d products"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-orders:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-local-orders-only}
    volumes:
      - orders-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-payments:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-local-payments-only}
    volumes:
      - payments-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 2s
      timeout: 3s
      retries: 30

  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.10
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.9.10
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  rabbitmq:
    image: rabbitmq:3.12-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  product-service:
    build: ./services/product-service
    environment:
      DATABASE_URL: postgresql://products:${PRODUCT_DB_PASSWORD:-local-products-only}@postgres-products:5432/products
      DB_PATH: /data/products.db
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: products
    volumes:
      - product-data:/data
    depends_on:
      kafka:
        condition: service_started
      postgres-products:
        condition: service_healthy

  order-service:
    build: ./services/order-service
    environment:
      DATABASE_URL: postgresql://orders:${ORDER_DB_PASSWORD:-local-orders-only}@postgres-orders:5432/orders
      DB_PATH: /data/orders.db
      PRODUCT_SERVICE_URL: http://product-service:8000
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC_ORDERS: orders
      KAFKA_TOPIC_PAYMENTS: payments
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENT_QUEUE: payment.requests
    volumes:
      - order-data:/data
    depends_on:
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_started
      product-service:
        condition: service_started
      postgres-orders:
        condition: service_healthy

  payment-service:
    build: ./services/payment-service
    environment:
      DATABASE_URL: postgresql://payments:${PAYMENT_DB_PASSWORD:-local-payments-only}@postgres-payments:5432/payments
      DB_PATH: /data/payments.db
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC_PAYMENTS: payments
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENT_QUEUE: payment.requests
    volumes:
      - payment-data:/data
    depends_on:
      kafka:
        condition: service_started
      rabbitmq:
        condition: service_started
      postgres-payments:
        condition: service_healthy

volumes:
  products-postgres:
  orders-postgres:
  payments-postgres:
  product-data:
  order-data:
  payment-data:
