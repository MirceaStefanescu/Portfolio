global:
  clusterId: finops-local
  prometheus:
    enabled: true
  grafana:
    enabled: true

persistentVolume:
  enabled: true
  size: 8Gi
  storageClass: standard

grafana:
  adminPassword: admin
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: standard
    accessModes:
      - ReadWriteOnce

# The local demo does not send product analytics or diagnostic reports.
reporting:
  productAnalytics: false
  logCollection: false

prometheus:
  server:
    persistentVolume:
      storageClass: standard
  nodeExporter:
    enabled: true
